{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}

{% block content %}
<div class="error-page">
  <div class="code">500<span>.</span></div>
  <h1 class="h3 mt-3">Something went wrong</h1>
  <p class="text-muted">An unexpected error happened. Please try again.</p>
  {% if current_user.is_authenticated %}
    <a href="{{ url_for(current_user.role ~ '.dashboard') }}" class="btn btn-primary">Go to my dashboard</a>
  {% else %}
    <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary">Go to home page</a>
  {% endif %}
</div>
{% endblock %}
