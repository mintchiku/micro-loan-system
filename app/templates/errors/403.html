{% extends "base.html" %}
{% block title %}Access denied{% endblock %}

{% block content %}
<div class="error-page">
  <div class="code">403<span>.</span></div>
  <h1 class="h3 mt-3">Access denied</h1>
  <p class="text-muted">You do not have permission to open this page.</p>
  {% if current_user.is_authenticated %}
    <a href="{{ url_for(current_user.role ~ '.dashboard') }}" class="btn btn-primary">Go to my dashboard</a>
  {% else %}
    <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary">Go to home page</a>
  {% endif %}
</div>
{% endblock %}
