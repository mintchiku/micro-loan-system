{% extends "base.html" %}
{% block title %}Page not found{% endblock %}

{% block content %}
<div class="error-page">
  <div class="code">404<span>.</span></div>
  <h1 class="h3 mt-3">Page not found</h1>
  <p class="text-muted">The page you are looking for does not exist.</p>
  {% if current_user.is_authenticated %}
    <a href="{{ url_for(current_user.role ~ '.dashboard') }}" class="btn btn-primary">Go to my dashboard</a>
  {% else %}
    <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary">Go to home page</a>
  {% endif %}
</div>
{% endblock %}
