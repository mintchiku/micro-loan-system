<rect x="906" y="380" width="190" height="38" rx="5" fill="#f3f3f3" stroke="#1f1f1f" stroke-width="2.4" stroke-dasharray="6 3"/>
<rect x="906" y="380" width="34" height="38" rx="5" fill="#e2e2e2" stroke="#4d4d4d" stroke-width="1.4"/>
<text x="923" y="404.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f1f1f" text-anchor="middle">₹</text>
<text x="906" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f1f1f" text-anchor="start" font-weight="700">! Must be greater than 0.</text>
<text x="704" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="700">Password *</text>
<rect x="704" y="468" width="190" height="38" rx="5" fill="#f3f3f3" stroke="#4d4d4d" stroke-width="1.4"/>
<text x="704" y="522" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6a6a6a" text-anchor="start">Min 8, letter + number</text>
<text x="906" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="700">Confirm password *</text>
<rect x="906" y="468" width="190" height="38" rx="5" fill="#f3f3f3" stroke="#1f1f1f" stroke-width="2.4" stroke-dasharray="6 3"/>
<text x="906" y="522" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f1f1f" text-anchor="start" font-weight="700">! Passwords do not match.</text>
