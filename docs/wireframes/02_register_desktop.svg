<text x="60" y="170" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#1f1f1f" text-anchor="start" font-weight="700">Create your borrower</text>
<text x="60" y="208" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#1f1f1f" text-anchor="start" font-weight="700">account</text>
<text x="60" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f1f1f" text-anchor="start">It takes two minutes. After that you can apply</text>
<text x="60" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f1f1f" text-anchor="start">for a loan whenever you are ready.</text>
<text x="60" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f1f1f" text-anchor="start">▣  See your EMI before you apply</text>
<text x="60" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f1f1f" text-anchor="start">▣  Upload one document, nothing more</text>
<text x="60" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f1f1f" text-anchor="start">▣  Follow each status update on your dashboard</text>
<rect x="600" y="84" width="600" height="700" rx="0" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="1.4"/>
<rect x="680" y="108" width="440" height="610" rx="10" fill="#ffffff" stroke="#4d4d4d" stroke-width="1.4"/>
