<text x="704" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6a6a6a" text-anchor="start">Fields marked * are required.</text>
<text x="704" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="700">Full name *</text>
<rect x="704" y="204" width="392" height="38" rx="5" fill="#f3f3f3" stroke="#1f1f1f" stroke-width="2.4" stroke-dasharray="6 3"/>
<text x="704" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f1f1f" text-anchor="start" font-weight="700">! Name is required.</text>
<text x="704" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f1f1f" text-anchor="start" font-weight="700">Email *</text>
